<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đại Việt Một Đời</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
  <div id="status" class="panel"></div>
  <div id="quests" class="panel"></div>
  <div id="prompt" class="panel" hidden></div>
  <div id="toast" class="panel" hidden></div>
  <canvas id="mini" width="192" height="144"></canvas>
  <div id="keys" class="panel"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> đi lại</span><span><kbd>Shift</kbd> chạy</span><span><kbd>E</kbd> tương tác</span><span><kbd>1</kbd>–<kbd>4</kbd> chọn</span><span><kbd>C</kbd> chỉ số</span><span><kbd>Esc</kbd> đóng</span></div>
</div>
<div id="dialog" class="panel" hidden><div class="who"></div><div class="txt"></div><div class="opts"></div></div>
<div id="modal" hidden><div class="card panel"></div></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
