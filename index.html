<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đại Việt Một Đời</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed pixel-art world at 3x; HUD as hard-edged lacquer panels with brass inlay, pinned to corners. Single dark look by choice. */
:root{
  --lacquer:#1d221f; --lacquer-2:#2a302b; --edge:#0b0d0c; --inlay:#6b5430;
  --ink:#efe8d4; --muted:#aab2a2; --jade:#9fcaa9; --iron:#d08a54; --gold:#e2bf72; --warn:#e07f6b;
  --display:"Alegreya SC", Georgia, "Times New Roman", serif;
  --body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:#0f1311;color:var(--ink);font-family:var(--body);overflow:hidden;font-size:14px}
#cv{position:fixed;inset:0;display:block;image-rendering:pixelated}
#hud{position:fixed;inset:0;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-bottom,0px))}
.panel{background:var(--lacquer);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--inlay),5px 5px 0 rgba(0,0,0,.45)}
#status{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:240px;padding:12px 14px;display:grid;gap:8px}
#status .name{font-family:var(--display);font-size:20px;line-height:1.1;text-wrap:balance}
#status .sub{color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
#status .date{font-family:var(--display);color:var(--gold);font-size:15px;letter-spacing:.02em}
.suc{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--muted)}
.suc i{width:11px;height:11px;border:2px solid var(--jade);display:inline-block}
.suc i.on{background:var(--jade)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-variant-numeric:tabular-nums}
.stat{display:flex;justify-content:space-between;font-size:13px;border-bottom:2px dotted #3b443d;padding-bottom:2px}
.stat b{font-weight:700;color:var(--ink)} .stat span{color:var(--muted)}
.path{font-size:12px;color:var(--iron);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
#quests{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:264px;padding:12px 14px;display:grid;gap:8px}
#quests h3,.kicker{font-family:var(--display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--jade);margin:0;font-weight:500}
.q{display:grid;gap:2px}.q b{font-weight:600;font-size:13.5px}.q span{font-size:12px;color:var(--muted);line-height:1.4}
.q.done b{color:var(--muted);text-decoration:line-through}
#mini{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--inlay),5px 5px 0 rgba(0,0,0,.45);background:#111;image-rendering:pixelated}
#keys{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));padding:8px 12px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;max-width:calc(100% - 270px)}
kbd{font-family:var(--body);font-size:11px;font-weight:600;border:2px solid var(--edge);border-bottom-width:3px;padding:0 5px;color:var(--ink);background:var(--lacquer-2)}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:112px;padding:7px 14px;font-weight:600;white-space:nowrap}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:max(18px,env(safe-area-inset-top,0px));max-width:min(520px,calc(100% - 580px));min-width:240px;padding:10px 16px;text-align:center;line-height:1.45;transition:opacity .3s}
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));width:min(660px,calc(100% - 32px));padding:16px 20px 14px;display:grid;gap:10px;z-index:5}
#dialog .who{font-family:var(--display);font-size:18px;color:var(--gold)}
#dialog .txt{line-height:1.6;font-size:14.5px;max-width:65ch}
.opts{display:grid;gap:6px}
.opt{pointer-events:auto;font:inherit;text-align:left;color:var(--ink);background:var(--lacquer-2);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px #3d463f;padding:8px 12px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.opt:hover:not(:disabled),.opt:focus-visible{box-shadow:inset 0 0 0 2px var(--jade);outline:none;background:#323a34}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt .k{font-size:11px;color:var(--jade);font-variant-numeric:tabular-nums;min-width:12px;font-weight:700}
.opt small{color:var(--muted);margin-left:auto;font-size:12px}
#modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,13,11,.58);z-index:10;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;overflow:auto}
#modal .card{width:min(600px,100%);padding:26px 28px 22px;display:grid;gap:14px}
#modal h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
#modal h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,7vw,64px);line-height:1;margin:0;text-wrap:balance}
#modal .body{line-height:1.65;font-size:15px;color:#ddd7c6;display:grid;gap:10px}
#modal .body p{margin:0;max-width:62ch}
#modal input{font:inherit;font-size:16px;padding:9px 12px;background:var(--lacquer-2);color:var(--ink);border:2px solid var(--edge);box-shadow:inset 0 0 0 1px #3d463f;width:100%}
#modal input:focus{outline:2px solid var(--jade);outline-offset:1px}
.src{font-size:12.5px;color:var(--muted);border-left:3px solid var(--inlay);padding-left:10px}
.seal{display:inline-block;border:2px solid var(--warn);color:var(--warn);font-family:var(--display);padding:2px 8px;letter-spacing:.1em;font-size:13px}
.endstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-variant-numeric:tabular-nums}
.endstats div{border:2px solid var(--edge);box-shadow:inset 0 0 0 1px #3d463f;padding:8px;text-align:center}
.endstats b{display:block;font-size:22px;font-family:var(--display);color:var(--gold)}
.endstats span{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
body.mg #toast{top:104px}
@media (max-width:960px){#quests{display:none}#toast{max-width:calc(100% - 300px)}}
@media (max-width:640px){#toast{max-width:calc(100% - 32px);top:auto;bottom:160px}#keys{display:none}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" hidden>
  <div id="status" class="panel"></div>
  <div id="quests" class="panel"></div>
  <div id="prompt" class="panel" hidden></div>
  <div id="toast" class="panel" hidden></div>
  <canvas id="mini" width="192" height="144"></canvas>
  <div id="keys" class="panel"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> đi lại</span><span><kbd>Shift</kbd> chạy</span><span><kbd>E</kbd> tương tác</span><span><kbd>1</kbd>–<kbd>4</kbd> chọn</span><span><kbd>Esc</kbd> đóng</span></div>
</div>
<div id="dialog" class="panel" hidden><div class="who"></div><div class="txt"></div><div class="opts"></div></div>
<div id="modal" hidden><div class="card panel"></div></div>

<script>
(()=>{
/* ================= constants ================= */
const TS=16, Z=3, T=TS*Z, W=96, H=72;
const G=0,WA=1,FI=2,PA=3,TR=4,MO=5,WL=6,SA=8,BR=9,ST=10,GA=11,WR=12;
const SEASONS=['Xuân','Hạ','Thu','Đông'];
const CAN=['Giáp','Ất','Bính','Đinh','Mậu','Kỷ','Canh','Tân','Nhâm','Quý'];
const CHI=['Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'];
const canchi=y=>CAN[(y+6)%10]+' '+CHI[(y+8)%12];
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');

/* ================= pixel helpers ================= */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d',{willReadFrequently:true})]}
function shade(hex,a){const n=parseInt(hex.slice(1),16);const r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(a>0?v+(255-v)*a:v*(1+a))));return'#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1)}
function Hs(x,y,k=0){let h=(x*374761393+y*668265263+k*2246822519)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function outline(c,col='#221913'){const g=c.getContext('2d'),w=c.width,h=c.height,d=g.getImageData(0,0,w,h).data,o=[];
  const A=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&d[(y*w+x)*4+3]>0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(!A(x,y)&&(A(x-1,y)||A(x+1,y)||A(x,y-1)||A(x,y+1)))o.push(x,y);
  g.fillStyle=col;for(let i=0;i<o.length;i+=2)g.fillRect(o[i],o[i+1],1,1);return c}
function disc(g,cx,cy,r,col){g.fillStyle=col;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r+r*.8-y*y));g.fillRect(cx-w,cy+y,w*2+1,1)}}
function flip(c){const[f,g]=mk(c.width,c.height);g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);f.ax=c.width-c.ax;f.ay=c.ay;return f}

/* ================= map ================= */
const map=new Uint8Array(W*H),bsolid=new Uint8Array(W*H);
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(1258);
const set=(x,y,v)=>{if(x>=0&&y>=0&&x<W&&y<H)map[y*W+x]=v};
const get=(x,y)=>(x<0||y<0||x>=W||y>=H)?MO:map[y*W+x];
const fill=(x0,y0,x1,y1,v)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)set(x,y,v)};
const isW=t=>t===WA||t===WR;
const tolichY=x=>24+2*Math.sin(x/7),hongX=y=>84+3*Math.sin(y/9);

const BUILDINGS=[
 {id:'home',name:'Nhà mình',x:41,y:46,w:5,h:3,kind:'house'},
 {id:'batu',name:'Nhà bà Tư',x:48,y:46,w:4,h:3,kind:'house'},
 {id:'nha1',name:'',x:33,y:46,w:4,h:3,kind:'house'},
 {id:'nha2',name:'',x:34,y:50,w:4,h:2,kind:'house'},
 {id:'truong',name:'Trường làng',x:30,y:39,w:5,h:3,kind:'school'},
 {id:'dinh',name:'Đình làng',x:31,y:33,w:7,h:3,kind:'dinh'},
 {id:'vo',name:'Sân võ',x:51,y:35,w:3,h:2,kind:'shed'},
 {id:'chua',name:'Chùa làng',x:20,y:9,w:6,h:4,kind:'pagoda'},
 {id:'cung',name:'Hoàng thành',x:46,y:5,w:15,h:5,kind:'palace'},
 {id:'hocvien',name:'Quốc học viện',x:38,y:5,w:6,h:3,kind:'school'},
 {id:'giangvo',name:'Giảng võ đường',x:62,y:9,w:6,h:3,kind:'dinh'},
 {id:'thap',name:'Tháp Báo Thiên',x:67,y:5,w:2,h:2,kind:'tower'},
 {id:'sach',name:'Hàng sách',x:38,y:13,w:3,h:2,kind:'stall'},
 {id:'ren',name:'Lò rèn',x:43,y:13,w:3,h:2,kind:'stall'},
 {id:'nhaituan',name:'Phường Nhai Tuân',x:58,y:13,w:3,h:2,kind:'stall'},
 {id:'gom',name:'Hàng gốm',x:62,y:16,w:3,h:2,kind:'stall'},
];
const DECOR=[{kind:'banyan',x:37,y:42,solid:1},{kind:'well',x:44,y:42,solid:1},{kind:'boat',x:85,y:9},{kind:'boat',x:86,y:14},{kind:'boat',x:82,y:40}];
const SIGNS=[
 {x:41,y:30,name:'Làng An Phú',text:'Làng An Phú, ven sông Tô Lịch. Phía bắc là kinh thành Thăng Long.'},
 {x:81,y:10,name:'Bến Đông Bộ Đầu',text:'Bến Đông Bộ Đầu bên sông Hồng. Đầu năm 1258, vua Trần Thái Tông và Thái tử ngự lâu thuyền đến đây đón đánh, phá tan quân giặc.'},
 {x:77,y:30,name:'Đường đi Phù Ủng',text:'Đường men theo sông Hồng xuống phía đông nam là làng Phù Ủng, huyện Đường Hào.'},
];

function road(x0,y0,x1,y1){for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++){const t=get(x,y);if(isW(t))set(x,y,BR);else if(t!==ST&&t!==GA&&t!==BR&&t!==WL)set(x,y,PA)}}
function buildMap(){
  map.fill(G);
  for(let i=0;i<260;i++)set(Math.floor(R()*W),Math.floor(R()*H),TR);
  for(let y=0;y<H;y++){const m=4+Math.round(2*Math.sin(y/5)+R()*2);for(let x=0;x<m;x++)set(x,y,MO)}
  for(let x=0;x<34;x++){const m=2+Math.round(R()*2);for(let y=0;y<m;y++)set(x,y,MO)}
  for(let y=28;y<H;y++)for(let x=5;x<24;x++)if(R()<0.62-(x-5)*0.014)set(x,y,TR);
  for(let y=4;y<18;y++)for(let x=14;x<31;x++)if(R()<0.4)set(x,y,TR);
  fill(19,7,27,16,G);fill(12,56,16,60,G);
  for(let x=6;x<84;x++){const c=tolichY(x);for(let y=18;y<31;y++){const d=Math.abs(y+.5-c);if(d<=1.4)set(x,y,WA);else if(d<=2.3&&get(x,y)!==WA)set(x,y,SA)}}
  for(let y=0;y<H;y++){const c=hongX(y);for(let x=74;x<W;x++){const d=Math.abs(x+.5-c);if(d<=2.6)set(x,y,WR);else if(d<=3.7&&get(x,y)!==WA)set(x,y,SA)}}
  fill(28,30,58,52,G);fill(48,20,58,21,G);fill(70,29,78,30,G);fill(71,9,82,12,G);
  fill(46,35,53,41,SA);fill(23,53,29,67,G);fill(16,57,23,59,G);
  for(let x=28;x<=60;x++)for(let y=Math.floor(tolichY(x)+2.4);y<30;y++)if(get(x,y)===TR)set(x,y,G);
  fill(36,3,70,19,ST);
  for(let x=36;x<=70;x++){set(x,3,WL);set(x,19,WL)}for(let y=3;y<=19;y++){set(36,y,WL);set(70,y,WL)}
  fill(52,19,54,19,GA);fill(70,11,70,12,GA);
  fill(30,53,58,66,FI);
  for(const y of[57,61,65])road(30,y,58,y);
  road(53,20,53,31);road(24,31,79,31);road(24,15,24,31);road(40,31,40,66);road(50,53,50,66);road(30,44,52,44);road(52,20,54,20);road(71,11,82,12);road(24,61,30,61);
  road(8,44,29,44);road(14,44,14,58);road(14,58,29,58);road(8,36,8,44);road(8,36,23,36);road(23,31,23,36);
  for(const b of BUILDINGS)for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)bsolid[y*W+x]=1;
  for(const d of DECOR)if(d.solid)bsolid[d.y*W+d.x]=1;
  for(const s of SIGNS)bsolid[s.y*W+s.x]=1;
}
buildMap();
const TREES=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(map[y*W+x]===TR)TREES.push({x,y,v:Hs(x,y,5)<.5?0:1});

/* ================= ground bake ================= */
const grassC=s=>['#7cb24f','#5d9a3e','#9ea84c','#8e9c6c'][s];
const tlC=s=>['#4f95aa','#4089a6','#5389a0','#5a8698'][s];
const hgC=s=>['#b07655','#b8714c','#a97b5d','#9b7764'][s];
const groundCache={};
function ground(s){if(groundCache[s])return groundCache[s];
  const[c,g]=mk(W*TS,H*TS);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)tilePx(g,map[y*W+x],x,y,s);
  return groundCache[s]=c}
function tilePx(g,t,x,y,s){
  const ox=x*TS,oy=y*TS,p=(dx,dy,w,h,col)=>{g.fillStyle=col;g.fillRect(ox+dx,oy+dy,w,h)};
  const grass=()=>{const b=grassC(s);p(0,0,16,16,b);
    for(let i=0;i<9;i++){const hx=Math.floor(Hs(x,y,i)*16),hy=Math.floor(Hs(x,y,i+30)*15);p(hx,hy,1,2,shade(b,i%3?-.18:.16))}
    if(s<3&&Hs(x,y,99)<.1){const fx=2+Math.floor(Hs(x,y,98)*11),fy=2+Math.floor(Hs(x,y,97)*11),fc=[['#f4a9bc','#fff4e2'],['#f4d84c','#fff4e2'],['#e3893a','#f4c04a']][s];p(fx,fy-1,1,1,fc[0]);p(fx-1,fy,3,1,fc[0]);p(fx,fy+1,1,1,fc[0]);p(fx,fy,1,1,fc[1])}};
  const edgeGrass=col=>{for(const[nx,ny,ex,ey,w]of[[0,-1,0,0,16],[0,1,0,15,16],[-1,0,0,0,1],[1,0,15,0,1]]){const n=get(x+nx,y+ny);if(n===G||n===TR){for(let k=0;k<16;k++)if(Hs(x*3+nx,y*3+ny,k)<.55){if(w>1)p(ex+k,ey,1,1,col);else p(ex,ey+k,1,1,col)}}}};
  switch(t){
   case G:case TR:grass();if(t===TR){g.fillStyle='rgba(20,40,20,.22)';g.fillRect(ox+3,oy+12,10,3)}break;
   case PA:{p(0,0,16,16,'#b99c68');for(let i=0;i<7;i++)p(Math.floor(Hs(x,y,i)*15),Math.floor(Hs(x,y,i+9)*15),i%2?2:1,1,i%3?'#9d8152':'#d0b886');edgeGrass(grassC(s));break}
   case SA:{p(0,0,16,16,'#d7c590');for(let i=0;i<6;i++)p(Math.floor(Hs(x,y,i)*16),Math.floor(Hs(x,y,i+9)*16),1,1,i%2?'#bba872':'#e8d9a8');break}
   case WA:case WR:case BR:{
     const hong=t===WR||(t===BR&&(get(x-1,y)===WR||get(x+1,y)===WR||get(x,y-1)===WR||get(x,y+1)===WR));
     const b=hong?hgC(s):tlC(s);p(0,0,16,16,b);
     if(t!==BR){const lt=shade(b,.28),wet=n=>isW(n)||n===BR;
       if(!wet(get(x,y-1)))p(0,0,16,2,lt);if(!wet(get(x,y+1)))p(0,15,16,1,shade(b,-.25));if(!wet(get(x-1,y)))p(0,0,1,16,lt);if(!wet(get(x+1,y)))p(15,0,1,16,lt);
       p(2+Math.floor(Hs(x,y,1)*8),4+Math.floor(Hs(x,y,2)*4),4,1,shade(b,.18));p(6+Math.floor(Hs(x,y,3)*6),10+Math.floor(Hs(x,y,4)*3),3,1,shade(b,.18))}
     else{p(2,0,12,16,'#90693e');for(let j=0;j<16;j+=3)p(2,j,12,1,'#6c4e2b');p(1,0,1,16,'#5a3f25');p(14,0,1,16,'#5a3f25');p(1,2,2,2,'#4a331e');p(13,2,2,2,'#4a331e');p(1,10,2,2,'#4a331e');p(13,10,2,2,'#4a331e')}
     break}
   case FI:{p(0,0,16,16,['#6e968c','#6a8d5c','#8b7c4b','#7a5f3f'][s]);

/* ================= UI ================= */
let dialogOpen=false,modalOpen=false,curOpts=[],modalQueue=[];
const floats=[];
const KEYS_DEFAULT=$('keys').innerHTML;
function setKeys(html){$('keys').innerHTML=html||KEYS_DEFAULT}
function toast(msg,ms=3600){const t=$('toast');t.textContent=msg;t.hidden=false;t.style.opacity=1;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.hidden=true,300)},ms)}
function floatAt(txt,x,y,color){floats.push({txt,color:color||'#ece6d4',x,y,t:0})}
function floatText(txt,color){floatAt(txt,S.x,S.y,color)}
function gain(k,n){const lab={van:'Văn',vo:'Võ',duc:'Đức',tien:'quan'}[k];S[k]=Math.max(0,Math.min(k==='tien'?999:100,S[k]+n));floatText((n>0?'+':'')+n+' '+lab,{van:'#9cc7e0',vo:'#f0a27f',duc:'#e2bf72',tien:'#c9e0a0'}[k]);renderHUD()}
function spend(n=1){if(S.suc<n){toast('Bạn đã mệt. Về nhà ngủ để sang mùa mới.');return false}S.suc-=n;renderHUD();return true}
function startQuest(id){if(S.quests[id])return;S.quests[id]='active';toast('Việc mới: '+QUESTS[id].title);renderHUD()}
function doneQuest(id){S.quests[id]='done';toast('Hoàn thành: '+QUESTS[id].title);renderHUD()}
function say(who,text,choices){
  dialogOpen=true;const d=$('dialog');d.hidden=false;
  d.querySelector('.who').textContent=who;d.querySelector('.txt').textContent=text;
  curOpts=choices&&choices.length?[...choices,{label:'Tạm biệt'}]:[{label:'Tạm biệt'}];
  const o=d.querySelector('.opts');o.innerHTML='';
  curOpts.forEach((c,i)=>{const b=document.createElement('button');b.className='opt';b.id='opt'+i;b.disabled=!!c.disabled;
    b.innerHTML=`<span class="k">${i+1}</span><span></span>${c.note?'<small></small>':''}`;b.children[1].textContent=c.label;if(c.note)b.querySelector('small').textContent=c.note;b.onclick=()=>pick(i);o.appendChild(b)});
}
function closeDialog(){dialogOpen=false;$('dialog').hidden=true}
function pick(i){const c=curOpts[i];if(!c||c.disabled)return;closeDialog();if(c.fn)c.fn()}
function showModal(m){modalQueue.push(m);if(!modalOpen)nextModal()}
function nextModal(){
  const m=modalQueue.shift();if(!m){modalOpen=false;$('modal').hidden=true;return}
  modalOpen=true;closeDialog();const box=$('modal');box.hidden=false;const c=box.querySelector('.card');
  c.innerHTML=`${m.kicker?`<div class="kicker">${m.kicker}</div>`:''}${m.big?`<h1>${m.title}</h1>`:`<h2>${m.title}</h2>`}<div class="body">${m.body||''}</div><div class="opts"></div>`;
  const ch=m.choices||[{label:'Tiếp tục'}];curOpts=ch;const o=c.querySelector('.opts');
  ch.forEach((x,i)=>{const b=document.createElement('button');b.className='opt';b.id='mopt'+i;b.disabled=!!x.disabled;
    b.innerHTML=`<span class="k">${i+1}</span><span></span>${x.note?'<small></small>':''}`;b.children[1].textContent=x.label;if(x.note)b.querySelector('small').textContent=x.note;b.onclick=()=>mpick(i);o.appendChild(b)});
  setTimeout(()=>{const f=c.querySelector('input')||c.querySelector('.opt:not(:disabled)');f&&f.focus()},30);
}
function mpick(i){const x=curOpts[i];if(!x||x.disabled)return;if(x.fn&&x.fn()===false)return;nextModal()}
function renderHUD(){
  if(!S)return;const a=age();
  const pathName={van:S.dothi?'Thái học sinh':'Sĩ tử · Quốc học viện',vo:'Hương binh',nong:'Nhà nông'}[S.path]||'';
  const hearts=n=>'♥'.repeat(Math.max(0,Math.min(8,n)))||'–';
  const rels=[S.co==='village'||S.co==='army'?`Cò ${hearts(S.rel.co)}`:'',S.ev.thao&&S.thao!=='gone'?`Thảo ${S.thao==='wife'?'(vợ)':S.thao==='co'?'(vợ Cò)':hearts(S.rel.thao)}`:''].filter(Boolean).join(' · ');
  $('status').innerHTML=`<div><div class="name"></div><div class="sub"><span>${a} tuổi</span><span>Làng An Phú</span></div></div>
   <div class="date">${SEASONS[S.season]} · ${canchi(S.year)} ${S.year}</div>
   <div class="suc">Sức&nbsp;${[0,1,2,3].map(i=>`<i class="${i<S.suc?'on':''}"></i>`).join('')}</div>
   <div class="stats"><div class="stat"><span>Văn</span><b>${S.van}</b></div><div class="stat"><span>Võ</span><b>${S.vo}</b></div><div class="stat"><span>Đức</span><b>${S.duc}</b></div><div class="stat"><span>Tiền</span><b>${S.tien} quan</b></div></div>
   ${pathName?`<div class="path">${pathName}</div>`:''}${rels?`<div class="sub"><span>${rels}</span></div>`:''}${S.items.length?`<div class="sub"><span>Hành trang: ${S.items.join(', ')}</span></div>`:''}`;
  $('status').querySelector('.name').textContent=S.name;
  const qs=Object.entries(S.quests);
  $('quests').innerHTML=`<h3>Việc cần làm</h3>`+(qs.length?qs.sort((x,y)=>(x[1]==='done')-(y[1]==='done')).map(([id,st])=>`<div class="q ${st}"><b>${QUESTS[id].title}</b>${st==='active'?`<span>${QUESTS[id].hint}</span>`:''}</div>`).join(''):`<div class="q"><span>Đi gặp mọi người trong làng để nhận việc.</span></div>`)+`<div class="q"><span>Về nhà để ngủ sang mùa mới, hoặc chọn việc chính và cho thời gian trôi nhanh.</span></div>`;
}

const pickR=a=>a[Math.floor(Math.random()*a.length)];
function vanLesson(){const v=S.van;return v<10?'Thầy dạy chữ trên khay cát, từng nét một.':v<25?'Thầy giảng sách dạy đạo làm người.':v<45?'Bạn đọc Luận ngữ, tập viết văn sách.':v<70?'Bạn học Kinh Thi, Kinh Thư, bình luận chuyện xưa.':'Bạn đọc Đại Việt sử ký, bàn về phép trị nước.'}
function voLesson(){const v=S.vo;return v<10?'Đứng tấn đến run cả chân.':v<25?'Tập côn pháp, múa gậy quanh sân.':v<45?'Tập đao pháp đến mỏi tay.':v<70?'Tập cưỡi ngựa, bắn cung.':'Học bày trận, đọc binh thư.'}
function talkMe(){
  const a=age(),ch=[];
  if(!S.quests.hoc){startQuest('hoc');return say('Mẹ','Con lên sáu rồi, phải đi học chữ thôi. Trường làng ở phía tây bắc, ngay dưới đình làng. Con đến chào thầy đồ Chu nhé.')}
  if(!S.ate)ch.push({label:'Ăn cơm mẹ nấu',note:'+1 Sức',fn:()=>{S.ate=true;S.suc=Math.min(4,S.suc+1);renderHUD();floatText('+1 Sức','#9fcaa9');toast('Cơm gạo mới, canh rau, cà muối. Bạn thấy khỏe hẳn.')}});
  if(S.year>=1275&&a>=17&&!S.quests.lua)startQuest('lua');
  if(S.quests.lua==='active'&&has('Lụa'))ch.push({label:'Biếu mẹ tấm lụa',fn:()=>{S.items.splice(S.items.indexOf('Lụa'),1);doneQuest('lua');gain('duc',4);say('Mẹ','Lụa đẹp quá con ạ. Mẹ để dành may áo đi lễ chùa.')}});
  let t;
  if(!S.cha)t=S.year<1280?'Từ ngày cha con mất, nhà mình vắng hẳn. Mẹ chỉ còn mỗi con thôi.':'Mẹ già rồi. Mỗi lần thắp hương cho cha con, mẹ lại kể chuyện con cho ông ấy nghe.';
  else if(S.thao==='wife')t=S.child?'Bé Sen giống con hồi nhỏ như đúc. Mẹ trông cháu, hai đứa cứ yên tâm làm ăn.':'Có Thảo về làm dâu, mẹ đỡ hẳn. Con bé chịu khó lắm.';
  else if(S.flags.de==='lost'&&S.year<1272)t='Năm nay mất mùa, nhà mình ăn độn khoai. Con chịu khó nhé.';
  else t=a<10?'Đi chơi thì đừng ra gần sông một mình nhé con.':a<16?'Con lớn nhanh quá. Cha con bảo ra đồng phụ được rồi đấy.':S.path==='vo'?'Mẹ may thêm cho con cái áo. Tập luyện thì giữ sức khỏe.':S.path==='van'?'Học hành trên kinh có vất vả không con? Nhớ về thăm nhà.':'Có con ở nhà, cha mẹ đỡ vất vả nhiều.';
  say('Mẹ',t,ch);
}
function talkCha(){
  const a=age(),b=S.buffalo;

  if(a>=7&&!S.quests.trau){startQuest('trau');loseBuffalo();return say('Cha','Sáng nay con trâu đứt thừng, giẫm nát cả bờ ruộng rồi chạy vào rừng phía tây. Con lần theo dấu chân nó mà tìm. Nhớ là trâu nhát lắm, lại gần thì đi khẽ thôi.')}
  if(a<8)return say('Cha','Ruộng nhà mình đây. Tám tuổi con ra phụ cha được rồi.');
  if(S.flags.daumua&&S.year<1281)return say('Cha',S.flags.daumua==='cham'?'Năm dịch, con bỏ cả việc để ngồi bên giường cha. Cha nhớ mãi.':'Nhờ thuốc của người Tống mà cha qua khỏi. Con biết lo xa lắm.');
  say('Cha',['Xuân thì cấy, hạ làm cỏ, thu gặt, đông cày ải. Đứng trên ruộng rồi bấm E mà làm.','Năm nào nước sông lên to là lo lắm. Phải giữ đê cho chắc.','Được mùa thì phải nhớ để dành thóc giống.'][S.season%3]);

function talkThay(){

  if(a>=12&&!S.quests.sach)ch.push({label:'Thầy có cần con giúp gì không?',fn:()=>{startQuest('sach');say('Thầy đồ Chu','Bộ Tứ thư của thầy mối mọt hết rồi. Trong kinh thành có hàng sách bán bản mới, giá sáu quan. Con mua giúp thầy được không?')}});
  if(S.quests.sach==='active'&&has('Tứ thư'))ch.push({label:'Biếu thầy bộ Tứ thư',fn:()=>{S.items=S.items.filter(i=>i!=='Tứ thư');doneQuest('sach');S.thayBonus=true;gain('van',5);gain('duc',2);say('Thầy đồ Chu','Quý hóa quá! Từ nay thầy kèm riêng cho con. Mỗi buổi học con được thêm một điểm Văn, và đi thi sẽ vững vàng hơn.')}});

function talkBaTu(){

function talkThao(){

const PEN={x:44.5,y:58.6};

function walkable(x,y){return x>=0&&y>=0&&x<W&&y<H&&![WA,WR,MO,TR,WL].includes(map[y*W+x])&&!bsolid[y*W+x]}

function hideSpots(){if(!reachOK)reachOK=bfs(43,50);const c=[];

  const[hx,hy]=pool[Math.floor(Math.random()*pool.length)],path=pathTo(Math.floor(fx),Math.floor(fy),hx,hy);
  b.run=path;b.ri=0;b.st='run';b.tracks=(b.tracks||[]).concat(path.filter((_,i)=>i%2===1).map(i=>[i%W,(i/W)|0]))}

   {label:'Ở lại học',note:'+2 Văn · Cò giận',fn:()=>{S.flags.dieu='hoc';S.rel.co=Math.max(0,S.rel.co-1);gain('van',2)}}]})},
 {id:'kinh',y:1270,s:0,run:()=>showModal({kicker:K(0,1270),title:'Mười hai tuổi',body:`<p>Cha mẹ đồng ý cho bạn tự đi lên kinh thành Thăng Long. Đi theo đường cái lên phía bắc, qua cầu sông Tô Lịch là đến cửa nam.</p><p>Trong kinh có hàng sách, lò rèn, Quốc học viện, Giảng võ đường và tháp Báo Thiên. Ra cửa đông là bến Đông Bộ Đầu.</p>`})},
 {id:'lut',y:1270,s:2,mg:true,run:()=>showModal({kicker:K(2,1270),title:'Nước to',body:`<p>Tháng bảy, mưa như trút. Ở kinh đô, phố phường phải đi lại bằng thuyền bè. Đêm ấy, đê sông Tô Lịch đầu làng An Phú vỡ năm chỗ. Trống làng gióng lên liên hồi.</p>${src('mùa thu, tháng 7 năm 1270, nước to, đường phố kinh đô phần nhiều phải đi lại bằng thuyền bè.')}`,choices:[
   {label:'Chạy ra đê cùng trai làng',note:'vào màn chơi',fn:startFlood},
   {label:'Ở nhà giúp cha mẹ dọn đồ lên cao',note:'nhà an toàn, làng thì không',fn:()=>{S.pending=null;S.flags.de='home';S.flags.lang-=1;S.rel.co=Math.max(0,S.rel.co-1);showModal({kicker:'Sáng hôm sau',title:'Đê vỡ',body:'<p>Đồ đạc nhà bạn còn nguyên, nhưng đê vỡ, ruộng cả làng ngập trắng. Cò ướt sũng từ ngoài đê về, nhìn bạn rồi quay đi. Cụ lý trưởng không nói gì.</p><p class="note">Làng sẽ nhớ chuyện này.</p>'})}}]})},
 {id:'daiNguyen',y:1271,s:3,run:()=>showModal({kicker:K(3,1271),title:'Đại Nguyên',body:`<p>Người kinh thành bàn tán: Mông Cổ đã đặt quốc hiệu là Đại Nguyên, sai sứ sang đòi vua Trần sang chầu. Vua lấy cớ có bệnh, từ chối không đi.</p>${src('năm 1271, Mông Cổ đặt quốc hiệu Đại Nguyên, sai sứ dụ vua vào chầu; vua cáo bệnh không đi.')}`})},
 {id:'su',y:1272,s:0,run:()=>showModal({kicker:K(0,1272),title:'Đại Việt sử ký',body:`<p>Thầy đồ Chu hào hứng kể: tháng giêng năm nay, Lê Văn Hưu vâng sắc chỉ soạn xong bộ <b>Đại Việt sử ký</b> gồm 30 quyển, chép từ Triệu Vũ Đế đến Lý Chiêu Hoàng, dâng lên vua. Vua xuống chiếu khen ngợi.</p><p class="note">Những chuyện như thế này có thể có trong đề thi sau này.</p>`,choices:[{label:'Xin thầy kể thêm',note:'+2 Văn',fn:()=>gain('van',2)}]})},
 {id:'thao',y:1272,s:1,run:()=>showModal({kicker:K(1,1272),title:'Cô cháu gái bà Tư',body:`<p>Bà Tư đón cháu gái là Thảo từ làng bên về ở cùng. Bố mẹ Thảo mất sau năm nước to. Cô bé ít nói, sáng nào cũng ra giếng gánh nước từ sớm.</p><p class="note">Thảo ở nhà bà Tư. Gặp gỡ, giúp đỡ Thảo sẽ làm hai người thân thiết hơn.</p>`})},
 {id:'chon',y:1274,s:0,run:choosePath},
 {id:'tong',y:1274,s:3,run:()=>showModal({kicker:K(3,1274),title:'Người Tống vượt biển',body:`<p>Bị quân Nguyên lấn đánh, người Tống đem 30 chiếc thuyền biển chở của cải và vợ con sang quy phụ. Triều đình cho họ ở phường Nhai Tuân trong kinh thành. Họ bày hàng bán vải lụa, thuốc men.</p><p class="note">Từ năm sau, ghé phường Nhai Tuân để mua lụa và thuốc.</p>${src('tháng 10 năm 1274, người Tống sang quy phụ, được an trí ở phường Nhai Tuân, mở chợ bán vải lụa, dược phẩm.')}`})},
 {id:'thi',y:1275,s:0,mg:true,run:()=>{
   const body=`<p>Tháng hai, triều đình mở khoa thi chọn học trò.</p>${src('mùa xuân, tháng 2 năm 1275, mở khoa thi; Đào Tiêu đỗ trạng nguyên, Quách Nhẫn thám hoa, 27 người đỗ thái học sinh.')}`;
   if(S.path==='van')showModal({kicker:K(0,1275),title:'Lều chõng đi thi',body:body+`<p>Bạn sẽ trả lời 5 câu hỏi. Cần đúng ${S.quests.sach==='done'?3:4} câu để đỗ${S.quests.sach==='done'?' (nhờ thầy Chu kèm riêng)':''}. Học càng rộng, càng loại được nhiều đáp án sai.</p>`,choices:[{label:'Vào trường thi',fn:startExam}]});
   else{S.pending=null;showModal({kicker:K(0,1275),title:'Khoa thi tháng hai',body:body+'<p>Đào Tiêu đỗ Trạng nguyên, Quách Nhẫn đỗ Thám hoa, cùng 27 người đỗ Thái học sinh. Cả làng xôn xao bàn tán.</p>'})}}},
 {id:'hoi',y:1276,s:0,run:()=>{if(!S.ev.thao||S.thao!=='none')return;showModal({kicker:K(0,1276),title:'Hội xuân làng An Phú',body:`<p>Sân đình rộn ràng tiếng trống. Người đánh đu, người đấu vật, trai gái hát đối đáp. Cò kéo bạn ra gốc đa, mặt đỏ bừng:</p><p>"Tớ thương Thảo lâu rồi. Cậu thân với cô ấy, nói giúp tớ một câu được không?"</p>`,choices:[
   {label:'Nói giúp Cò',note:'Cò thân hơn nhiều · nhường Thảo',fn:()=>{S.thao='co';S.rel.co+=3;showModal({kicker:'Hội xuân',title:'Lời nói giúp',body:'<p>Bạn tìm Thảo, kể về tấm lòng của Cò. Thảo cúi đầu, rất lâu mới khẽ gật. Cò ôm chầm lấy bạn: "Đời này tớ nợ cậu."</p>'})}},
   {label:'Nói thật: tớ cũng thương Thảo',note:'Cò giận · Thảo sẽ tự chọn',fn:()=>{S.flags.rival=true;S.rel.co=Math.max(0,S.rel.co-2);S.rel.thao++;showModal({kicker:'Hội xuân',title:'Hai người bạn',body:'<p>Cò sững người, rồi cười gượng: "Thế thì để Thảo chọn." Cả buổi hội, cậu không nói với bạn câu nào.</p><p class="note">Đến năm 1279, Thảo sẽ chọn người cô ấy thân thiết hơn.</p>'})}},
   {label:'Gạt đi, ra sân đấu vật',note:'+2 Võ',fn:()=>{S.flags.vat=true;gain('vo',2);showModal({kicker:'Hội xuân',title:'Sới vật',body:'<p>Bạn vật ngã ba trai làng bên, được thưởng một tấm khăn đỏ. Còn Cò thì tự mình đi tìm Thảo.</p>'})}}]})}},
 {id:'daumua',y:1278,s:0,run:()=>{if(!S.cha)return;S.pending=null;showModal({kicker:K(0,1278),title:'Dịch đậu mùa',body:`<p>Mùa xuân năm nay, dân chết nhiều vì bệnh đậu mùa. Cha bạn lên cơn sốt, nổi mụn khắp người, nằm li bì.</p>${src('mùa xuân, tháng 2 năm 1278, dân chết nhiều vì bệnh đậu mùa.')}`,choices:[
   {label:'Bỏ hết mọi việc, ở nhà chăm cha',note:'hết Sức mùa này · +3 Đức',fn:()=>{S.flags.daumua='cham';S.suc=0;gain('duc',3);showModal({kicker:'Cuối xuân',title:'Cha qua khỏi',body:'<p>Bạn thức trắng bao đêm bên giường, đút từng thìa cháo. Cuối xuân, cha ngồi dậy được, nắm tay bạn không nói nên lời.</p>'})}},
   {label:'Lên phường Nhai Tuân mua thuốc của người Tống',note:S.tien>=5?'−5 quan · còn 2 Sức':'cần 5 quan',disabled:S.tien<5,fn:()=>{S.flags.daumua='thuoc';S.tien-=5;S.suc=2;renderHUD();showModal({kicker:'Cuối xuân',title:'Thang thuốc phương bắc',body:'<p>Bạn chạy một mạch lên kinh, mua được thang thuốc của ông lái buôn người Tống. Uống được mươi hôm, cha dần lại sức.</p>'})}},
   {label:'Nhờ mẹ trông, mình vẫn lo việc học, luyện',note:'+4 '+(S.path==='vo'?'Võ':'Văn'),fn:()=>{S.flags.daumua='mat';S.cha=false;if(S.path==='vo')gain('vo',4);else gain('van',4);showModal({kicker:'Cuối xuân',title:'Cha mất',body:'<p>Bạn về đến nhà thì đã muộn. Cha mất trong một đêm mưa phùn cuối xuân. Mẹ ngồi bên linh sàng, không khóc được nữa.</p><p class="note">Từ nay nhà chỉ còn bạn và mẹ.</p>'})}}]})}},
 {id:'ngu',y:1278,s:1,run:()=>{if(S.nguMet)showModal({kicker:K(1,1278),title:'Tin về anh Ngũ',body:`<p>Anh Ngũ người Phù Ủng không còn ngồi đọc sách bên đường nữa. Người ta kể, Hưng Đạo Vương gặp anh, thấy có kỳ tài, đem con gái nuôi gả cho, nhận làm gia thần và dạy bảo thêm.</p><p>Đời sau biết anh với tên <b>Phạm Ngũ Lão</b>.</p>${src('Ngũ Lão người làng Phù Ủng, lúc hơn hai mươi tuổi được Hưng Đạo Vương thấy là có kỳ tài, gả con gái nuôi cho.')}`})}},
 {id:'nhantong',y:1278,s:3,run:()=>showModal({kicker:K(3,1278),title:'Vua mới lên ngôi',body:`<p>Ngày 22 tháng 10, vua Trần Thánh Tông nhường ngôi cho Hoàng thái tử Khâm, tức vua <b>Trần Nhân Tông</b>. Vua mới sinh tháng 11 năm Mậu Ngọ, cùng tuổi với bạn.</p>${src('mùa đông, tháng 10, ngày 22 năm 1278, vua nhường ngôi cho hoàng thái tử Khâm.')}`})},
 {id:'cuoi',y:1279,s:0,run:eventCuoi},
 {id:'con',y:1281,s:0,run:()=>{if(!S.married)return;S.child=true;gain('duc',2);showModal({kicker:K(0,1281),title:'Tiếng khóc trẻ thơ',body:'<p>Thảo sinh một bé gái. Cả nhà đặt tên con là Sen. Mẹ bế cháu đi khắp xóm khoe.</p><p class="note">Từ nay có thêm một người để bạn bảo vệ.</p>'})}},
 {id:'thaymat',y:1281,s:2,run:()=>{if(!S.thay)return;S.thay=false;showModal({kicker:K(2,1281),title:'Thầy đồ Chu qua đời',body:'<p>Thầy đồ Chu mất vào một chiều thu, tay vẫn cầm cuốn sách. Nhà thầy nghèo, không có con cháu gần.</p>',choices:[
   {label:'Đứng ra lo tang cho thầy',note:'−3 quan · +3 Đức',disabled:S.tien<3,fn:()=>{S.tien-=3;S.flags.tang='lo';S.flags.lang++;gain('duc',3);const books=S.van>=30;if(books)gain('van',3);showModal({kicker:'Đám tang',title:'Ơn thầy',body:`<p>Cả làng theo bạn tiễn thầy ra đồng.${books?' Người nhà thầy trao lại cho bạn tủ sách thầy để lại: "Thầy dặn chỉ trò mới đọc được hết."':''}</p>`})}},
   {label:'Gửi chút tiền phúng viếng',note:'−1 quan',fn:()=>{S.tien=Math.max(0,S.tien-1);S.flags.tang='vieng';gain('duc',1)}}]})}},
 {id:'toado',y:1282,s:2,run:()=>showModal({kicker:K(2,1282),title:'Tin dữ từ Lạng Châu',body:`<p>Quan trấn giữ Lạng Châu chạy trạm về báo: Hữu thừa tướng Nguyên là Toa Đô đem 50 vạn quân, nói phao là mượn đường đánh Chiêm Thành, nhưng thực ra là sang xâm lược nước ta.</p>${src('mùa thu, tháng 8 năm 1282, Lạng Châu báo Toa Đô đem 50 vạn quân, mượn cớ đánh Chiêm Thành để sang xâm lược.')}`})},
 {id:'binhthan',y:1282,s:3,run:()=>{showModal({kicker:K(3,1282),title:'Hội nghị Bình Than',body:`<p>Tháng 10, vua ngự ra Bình Than, họp vương hầu và trăm quan bàn kế công thủ. Ở bến sông, vua nhận ra người lái thuyền than đội nón lá, mặc áo ngắn chính là Nhân Huệ Vương Trần Khánh Dư, bèn tha tội, cho làm Phó đô tướng quân.</p><p>Hoài Văn hầu Trần Quốc Toản còn trẻ, không được dự bàn, phẫn kích bóp nát quả cam trong tay lúc nào không biết. Về nhà, chàng tập hợp hơn nghìn gia nô, thân thuộc, viết lên cờ sáu chữ <b>Phá cường địch, báo hoàng ân</b>.</p>${src('Quốc Toản trong lòng hổ thẹn, phẫn kích, tay cầm quả cam bóp nát lúc nào không biết.')}`});
   if(S.co==='village')showModal({kicker:'Ít hôm sau',title:'Cò muốn đi',body:`<p>Cò tìm đến nhà bạn, mắt sáng rực: "Nghe nói Hoài Văn hầu đang tập hợp người đánh giặc. Tớ muốn theo. Ở làng mãi thì làm được gì?"</p>${S.thao==='co'?'<p>Phía sau, Thảo đứng nép bên cửa, mắt đỏ hoe.</p>':''}`,choices:[
     {label:'Khuyên Cò ở lại giữ làng',note:'Cò sẽ ở bên bạn khi giặc đến',fn:()=>{S.flags.coStay=true;showModal({kicker:'Ít hôm sau',title:'Ở lại',body:'<p>"Giặc mà đến, làng mình cần người hơn ai hết." Cò im lặng rất lâu, rồi gật đầu.</p>'})}},
     {label:'Ủng hộ Cò lên đường',note:'Cò thân hơn · rời làng',fn:()=>{S.co='army';S.rel.co+=2;showModal({kicker:'Ít hôm sau',title:'Lên đường',body:'<p>Bạn tiễn Cò ra đến bến sông. Cậu giơ cao nắm tay: "Phá cường địch, báo hoàng ân!" rồi đi không ngoảnh lại.</p>'})}}]})}},
 {id:'tietche',y:1283,s:3,mg:true,run:()=>{
   const body=`<p>Vua thân hành dẫn các vương hầu điều quân thủy bộ tập trận. Hưng Đạo Vương Trần Quốc Tuấn được phong Quốc công tiết chế, thống lĩnh quân đội cả nước.</p>${src('mùa đông, tháng 10 năm 1283, Hưng Đạo Vương được phong Quốc công tiết chế, thống lĩnh quân đội toàn quốc.')}`;
   if(S.path==='vo')showModal({kicker:K(3,1283),title:'Quốc công tiết chế',body:body+'<p>Đội hương binh của bạn được gọi đi tập trận cùng quan quân. Đây là dịp để tướng lĩnh để mắt đến bạn.</p>',choices:[{label:'Ra bãi tập',fn:startTraining}]});
   else{S.pending=null;showModal({kicker:K(3,1283),title:'Quốc công tiết chế',body})}}},
 {id:'tolich',y:1284,s:0,run:()=>showModal({kicker:K(0,1284),title:'Vét sông Tô Lịch',body:`<p>Tháng giêng, triều đình cho vét sông Tô Lịch. Trai tráng làng An Phú, nằm ngay bên sông, đều được gọi ra làm.</p>${src('mùa xuân, tháng giêng năm 1284, vét sông Tô Lịch.')}`,choices:[
   {label:'Ra sông cùng dân làng',note:'−1 Sức · +2 Đức · lòng sông sâu hơn',fn:()=>{S.flags.tolich='done';S.flags.lang++;S.suc=Math.max(0,S.suc-1);gain('duc',2);gain('vo',1)}},
   {label:'Ở nhà đọc sách',note:'+2 Văn · làng chê',fn:()=>{S.flags.tolich='skip';S.flags.lang--;gain('van',2)}}]})},
 {id:'duyetbinh',y:1284,s:2,run:()=>showModal({kicker:K(2,1284),title:'Duyệt binh Đông Bộ Đầu',body:`<p>Tháng 8, Hưng Đạo Vương điều quân các vương hầu, duyệt binh lớn ở bến Đông Bộ Đầu, rồi chia quân đóng giữ Bình Than và những nơi xung yếu.</p>${S.path==='vo'?'<p>Bạn đứng trong hàng ngũ hương binh trên bến sông, cờ xí rợp trời.</p>':'<p>Quan quân về các làng xin góp lương thảo.</p>'}${src('mùa thu, tháng 8 năm 1284, Hưng Đạo Vương duyệt binh lớn ở Đông Bộ Đầu, chia quân giữ Bình Than.')}`,
   choices:S.path==='vo'?[{label:'Thề quyết chiến',note:'+5 Võ',fn:()=>{S.flags.duyet='the';gain('vo',5)}}]:[
   {label:'Góp lương cho quân',note:'−3 quan · +3 Đức · làng quý',fn:()=>{S.flags.duyet='luong';S.tien=Math.max(0,S.tien-3);S.flags.lang++;gain('duc',3)}},
   {label:'Giữ thóc cho nhà',note:'nhà nhiều thóc hơn khi có biến',fn:()=>{S.flags.duyet='giu'}}]})},
 {id:'dienhong',y:1284,s:3,run:()=>showModal({kicker:K(3,1284),title:'Hội nghị Diên Hồng',body:`<p>Tháng chạp, sứ về báo vua Nguyên sai Thoát Hoan, A Lạt đem quân, lấy cớ mượn đường đánh Chiêm Thành, chia đường sang đánh nước ta.</p><p>Thượng hoàng Trần Thánh Tông triệu phụ lão trong nước họp ở thềm điện Diên Hồng, ban yến và hỏi kế đánh giặc. Cụ lý trưởng làng An Phú cũng được vời về kinh. Trước khi đi, cụ hỏi ý bạn.</p>`,choices:[

  const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.fillStyle='#2a302b';g.fillRect(0,0,480,72);

const keys={};let lastAxis='y';
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Enter'){e.preventDefault();mpick(0)}return}
  const k=e.key.toLowerCase();keys[k]=true;
  if(['a','d','arrowleft','arrowright'].includes(k))lastAxis='x';else if(['w','s','arrowup','arrowdown'].includes(k))lastAxis='y';
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(MG&&MG.modalKey&&modalOpen&&MG.modalKey(k))return;
  if(modalOpen){if(/^[1-9]$/.test(k))mpick(+k-1);return}
  if(dialogOpen){if(/^[1-9]$/.test(k))pick(+k-1);else if(k==='escape')closeDialog();return}
  if(MG&&MG.key&&playing&&MG.key(k))return;
  if(k==='e'&&playing&&target)target.act();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
function solidAt(px,py){const tx=Math.floor(px),ty=Math.floor(py),t=get(tx,ty);if(isW(t)||t===MO||t===TR||t===WL)return true;if(t===GA&&age()<12)return true;return bsolid[ty*W+tx]===1}
function canStand(x,y){const r=.28;return!solidAt(x-r,y-.12)&&!solidAt(x+r,y-.12)&&!solidAt(x-r,y+.12)&&!solidAt(x+r,y+.12)}
let target=null,gateWarn=0;
function update(dt){
  if(!playing||modalOpen||dialogOpen){P.moving=false;return}
  let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(dx&&dy){if(lastAxis==='x')dy=0;else dx=0}
  P.moving=!!(dx||dy);
  if(P.moving){const l=Math.hypot(dx,dy);dx/=l;dy/=l;const sp=(keys.shift?7:4.4)*(.8+.2*Math.min(1,(age()-6)/10))*(MG&&MG.speedMul?MG.speedMul():1)*dt;
    if(Math.abs(dx)>Math.abs(dy))P.dir=dx>0?'right':'left';else P.dir=dy>0?'down':'up';
    const nx=S.x+dx*sp,ny=S.y+dy*sp;if(canStand(nx,S.y))S.x=nx;if(canStand(S.x,ny))S.y=ny;
    P.walk+=dt*(keys.shift?14:9);
    if(age()<12&&get(Math.floor(S.x+dx*.6),Math.floor(S.y+dy*.6))===GA&&performance.now()-gateWarn>4000){gateWarn=performance.now();toast('Lính gác: Trẻ con không được một mình vào kinh. Đợi mười hai tuổi đã.')}
  }
  buffaloUpdate(dt);
  for(const n of NPCS)if(n.wander){n.t=(n.t||0)-dt;if(n.t<=0){n.t=2+Math.random()*3;n.tx=n.home[0]+(Math.random()*4-2);n.ty=n.home[1]+(Math.random()*2-1)}
    const d=Math.hypot(n.tx-n.x,n.ty-n.y);if(d>.05){const nx=n.x+(n.tx-n.x)/d*1.2*dt,ny=n.y+(n.ty-n.y)/d*1.2*dt;n.face=dirOf(n.tx-n.x,n.ty-n.y);if(!solidAt(nx,ny)){n.x=nx;n.y=ny;n.moving=true}else n.tx=n.x}else n.moving=false}
  findTarget();
  if(MG&&MG.update)MG.update(dt);
  for(const f of floats)f.t+=dt;while(floats.length&&floats[0].t>1.6)floats.shift();
}
function setPrompt(){const p=$('prompt');if(target){p.hidden=false;p.innerHTML='<kbd>E</kbd> ';p.append(target.label)}else p.hidden=true}
function findTarget(){
  if(MG&&MG.findTarget){target=MG.findTarget();return setPrompt()}
  target=null;let best=1.5;
  for(const n of NPCS){if(!npcOn(n))continue;const d=Math.hypot(n.x-S.x,n.y-S.y);if(d<best){best=d;target={label:'Nói chuyện với '+n.name,act:()=>n.talk()}}}
  const b=S.buffalo;{const d=Math.hypot(b.x-S.x,b.y-S.y),lab=buffaloLabel();if(lab&&d<best){best=d;target={label:lab,act:talkBuffalo}}}
  for(const sg of SIGNS){const d=Math.hypot(sg.x+.5-S.x,sg.y+1.2-S.y);if(d<best){best=d;target={label:'Đọc biển: '+sg.name,act:()=>say(sg.name,sg.text)}}}
  if(!target)for(const bd of BUILDINGS){if(!['home','cung','chua','dinh','truong','thap'].includes(bd.id))continue;const dx=bd.x+Math.floor(bd.w/2)+.5,dy=bd.y+bd.h+.3;if(Math.hypot(dx-S.x,dy-S.y)<1.3){target={label:bd.id==='home'?'Vào nhà':'Xem '+bd.name,act:()=>doorAction(bd)};break}}
  if(!target&&get(Math.floor(S.x),Math.floor(S.y))===FI&&age()>=8)target={label:'Làm đồng  (−1 Sức)',act:fieldAction};
  if(!target){const v={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[P.dir];if(isW(get(Math.floor(S.x+v[0]*.9),Math.floor(S.y+v[1]*.9))))target={label:'Câu cá  (−1 Sức)',act:fishAction}}
  setPrompt();
}

function drawSprite(c,wx,wy){blit(c,wx*TS-c.ax,wy*TS-c.ay)}
function shadow(wx,wy,w){const ax=Math.round(wx*TS),ay=Math.round(wy*TS);ctx.fillStyle='rgba(20,15,10,.28)';ctx.fillRect((ax-w/2+1)*Z-camX,(ay-1)*Z-camY,(w-2)*Z,Z);ctx.fillRect((ax-w/2)*Z-camX,ay*Z-camY,w*Z,Z);ctx.fillRect((ax-w/2+1)*Z-camX,(ay+1)*Z-camY,(w-2)*Z,Z)}
function label(txt,x,y,col){ctx.font='600 12px "Be Vietnam Pro", system-ui, sans-serif';const w=Math.ceil(ctx.measureText(txt).width)+12;x=Math.round(x);y=Math.round(y);ctx.fillStyle='#0b0d0c';ctx.fillRect(x-w/2-2,y-11,w+4,22);ctx.fillStyle='#1d221f';ctx.fillRect(x-w/2,y-9,w,18);ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y+.5)}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const parts=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),s:.5+Math.random(),p:Math.random()*6}));

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=false;
  const fx=S?S.x:titleCam,fy=S?S.y:30;
  camX=Math.max(0,Math.min(W*T-VW,fx*T-VW/2));camY=Math.max(0,Math.min(H*T-VH,fy*T-VH/2));
  camX=Math.round(camX/Z)*Z;camY=Math.round(camY/Z)*Z;
  ctx.fillStyle='#0f1311';ctx.fillRect(0,0,VW,VH);
  const s=season(),gc=ground(s);
  ctx.drawImage(gc,camX/Z,camY/Z,VW/Z,VH/Z,0,0,VW,VH);
  const x0=Math.max(0,Math.floor(camX/T)-1),y0=Math.max(0,Math.floor(camY/T)-1),x1=Math.min(W-1,Math.ceil((camX+VW)/T)+1),y1=Math.min(H-1,Math.ceil((camY+VH)/T)+2);
  if(!reduce)for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(!isW(map[y*W+x]))continue;const h=Hs(x,y,7);if(h>.45)continue;const ph=(clock*.9+h*7)%3;if(ph>1.3)continue;ctx.fillStyle='rgba(255,255,255,.55)';const gx=Math.floor(Hs(x,y,8)*11)+Math.floor(ph*2),gy=3+Math.floor(Hs(x,y,9)*10);ctx.fillRect((x*TS+gx)*Z-camX,(y*TS+gy)*Z-camY,2*Z,Z)}
  if(S&&age()<12){ctx.fillStyle='#4a2c1c';for(let x=52;x<=54;x++)ctx.fillRect((x*TS+2)*Z-camX,(19*TS+2)*Z-camY,12*Z,14*Z);for(let y=11;y<=12;y++)ctx.fillRect((70*TS+2)*Z-camX,(y*TS+1)*Z-camY,12*Z,14*Z);ctx.fillStyle='#d9b14a';for(let x=52;x<=54;x++){ctx.fillRect((x*TS+5)*Z-camX,(19*TS+8)*Z-camY,Z,Z);ctx.fillRect((x*TS+10)*Z-camX,(19*TS+8)*Z-camY,Z,Z)}}
  drawTracks();
  const list=[];
  for(const t of TREES)if(t.x>=x0-1&&t.x<=x1+1&&t.y>=y0&&t.y<=y1+2)list.push({y:t.y+.9,f:()=>drawSprite(treeSprite(s,t.v),t.x+.5,t.y+1)});
  for(const b of BUILDINGS){if(b.x>x1+2||b.x+b.w<x0-2||b.y>y1+3||b.y+b.h<y0-2)continue;list.push({y:b.y+b.h,f:()=>{const c=buildingSprite(b);blit(c,b.x*TS-c.ox,b.y*TS-c.oy)}})}
  for(const d of DECOR){if(d.x<x0-3||d.x>x1+3||d.y<y0-3||d.y>y1+3)continue;list.push({y:d.y+(d.kind==='boat'?.4:1),f:()=>{if(d.kind==='banyan')drawSprite(banyanSprite(s),d.x+.5,d.y+1);else if(d.kind==='well')drawSprite(wellSprite(),d.x+.5,d.y+1);else{const bob=reduce?0:Math.round(Math.sin(clock*1.5+d.x));drawSprite(boatSprite(),d.x+.5,d.y+.6+bob/TS)}}})}
  for(const sg of SIGNS)list.push({y:sg.y+1,f:()=>drawSprite(signSprite(),sg.x+.5,sg.y+1)});
  if(S){
    const a=age();
    for(const n of NPCS){if(!npcOn(n))continue;if(n.x<x0-2||n.x>x1+2||n.y<y0-2||n.y>y1+2)continue;
      const look=n.id==='co'?coLook():n.look,dpx=S.x-n.x,dpy=S.y-n.y;let dir=n.moving?n.face:'down';
      if(!n.moving&&Math.hypot(dpx,dpy)<3)dir=Math.abs(dpx)>Math.abs(dpy)?(dpx>0?'right':'left'):(dpy>0?'down':'up');
      const fr=n.moving?[1,0,2,0][Math.floor(clock*8)%4]:0;
      list.push({y:n.y,f:()=>{shadow(n.x,n.y,10);drawSprite(personSprite(look,dir,fr),n.x,n.y)},lab:Math.hypot(dpx,dpy)<4?[n.name,n.x,n.y-(look.kid?1.35:look.spear?2.05:1.75)]:null})}
    list.push({y:S.buffalo.y,f:()=>{shadow(S.buffalo.x,S.buffalo.y,22);drawSprite(buffaloSprite(S.buffalo.dir||'left'),S.buffalo.x,S.buffalo.y)}});
    const look={shirt:S.path==='van'?'#2f4f62':S.path==='vo'?'#7a3328':'#6b4a2e',hair:a<14?'kid':'man',kid:a<14,band:S.path==='vo',long:S.path==='van'};
    const fr=P.moving?[1,0,2,0][Math.floor(P.walk)%4]:0;
    list.push({y:S.y,f:()=>{if(MG&&MG.inv>0&&Math.floor(clock*14)%2)return;shadow(S.x,S.y,10);drawSprite(personSprite(look,P.dir,fr),S.x,S.y)}});
  }
  if(MG&&MG.draw)MG.draw(list);
  list.sort((p,q)=>p.y-q.y);for(const o of list)o.f();
  if(!S)return;
  if(MG&&MG.post)MG.post();
  for(const b of BUILDINGS)if(b.name&&Math.hypot(b.x+b.w/2-S.x,b.y+b.h-S.y)<7){const c=buildingSprite(b);label(b.name,(b.x*TS+b.w*TS/2)*Z-camX,(b.y*TS-c.oy+6)*Z-camY,'#efe8d4')}
  for(const o of list)if(o.lab)label(o.lab[0],o.lab[1]*T-camX,o.lab[2]*T-camY,'#e2bf72');
  for(const sg of SIGNS)if(Math.hypot(sg.x-S.x,sg.y-S.y)<5)label(sg.name,(sg.x+.5)*T-camX,(sg.y-.2)*T-camY,'#9fcaa9');
  ctx.fillStyle=['rgba(255,220,230,.04)','rgba(255,210,120,.05)','rgba(220,160,60,.07)','rgba(150,180,220,.11)'][s];ctx.fillRect(0,0,VW,VH);
  if(!reduce&&s!==1&&!(MG&&MG.post)){ctx.fillStyle=s===0?'#f3b6c4':s===2?'#d99a3a':'rgba(235,242,250,.85)';for(const p of parts){p.y+=.0006*p.s;p.x+=Math.sin(clock+p.p)*.0004;if(p.y>1)p.y=0;ctx.fillRect(Math.round(p.x*VW/Z)*Z,Math.round(p.y*VH/Z)*Z,Z*(s===3?1:2),Z)}}
  ctx.font='700 14px "Be Vietnam Pro", system-ui, sans-serif';ctx.textAlign='center';
  for(const f of floats){ctx.globalAlpha=Math.max(0,1-f.t/1.6);const fx2=f.x*T-camX,fy2=f.y*T-camY-90-f.t*26;ctx.fillStyle='#0b0d0c';ctx.fillText(f.txt,fx2+2,fy2+2);ctx.fillStyle=f.color;ctx.fillText(f.txt,fx2,fy2)}ctx.globalAlpha=1;
  if(MG&&MG.hud)MG.hud();
  drawMini();
}
const mini=$('mini'),mctx=mini.getContext('2d');
function drawMini(){mctx.imageSmoothingEnabled=true;mctx.drawImage(ground(season()),0,0,192,144);mctx.fillStyle='#6b3a28';for(const b of BUILDINGS)mctx.fillRect(b.x*2,b.y*2,b.w*2,b.h*2);
  mctx.strokeStyle='rgba(255,255,255,.6)';mctx.strokeRect(camX/T*2+.5,camY/T*2+.5,VW/T*2,VH/T*2);
  mctx.fillStyle='#fff';mctx.fillRect(S.x*2-2,S.y*2-2,4,4);mctx.fillStyle='#000';mctx.fillRect(S.x*2-1,S.y*2-1,2,2);}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;if(MG&&MG.tick)MG.tick(dt);if(!S)titleCam=48+Math.sin(clock*.08)*22;if(S)update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
titleScreen();
})();
</script>
</body>
